<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Redirecionando — Método PMDF</title></head><body style="font:16px system-ui;background:#081429;color:#f5f5f5;padding:3rem"><h1>Método PMDF</h1><p id="message">Verificando endereço de confirmação...</p><script>(function(){const current=new URL(location.href);const allowed=current.pathname.startsWith('/metodo-pmdf/auth/confirm')||current.searchParams.has('token_hash')||current.hash.includes('access_token=')||current.hash.includes('error=');const target=new URL('/metodo-pmdf/',current.origin);if(allowed){target.search=current.search;target.hash=current.hash;location.replace(target.href);}else{document.getElementById('message').textContent='Página não encontrada. Abra https://'+current.host+'/metodo-pmdf/';}})();</script><p><a href="/metodo-pmdf/" style="color:#f0d075">Ir ao início</a></p></body></html>
