name: QA Flashcards
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flashcards-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Geração, importação, exportação e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Capturas desktop e celular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-qa-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
