name: Publicar Gemini no Supabase (se configurado)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gemini-questions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-gemini.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wskuhkvgipqwykbnuspk
    steps:
      - uses: actions/checkout@v4
      - name: Verificar credenciais de deploy
        id: configuration
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Implantação Gemini não executada: configure SUPABASE_ACCESS_TOKEN em GitHub Actions Secrets. Nunca armazene GEMINI_API_KEY no GitHub."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.configuration.outputs.enabled == 'true'
        with:
          version: latest
      - name: Implantar somente a função Gemini
        if: steps.configuration.outputs.enabled == 'true'
        run: supabase functions deploy gemini-questions --project-ref "$SUPABASE_PROJECT_REF"
      - name: Resumo de implantação
        if: steps.configuration.outputs.enabled == 'true'
        run: echo "Função enviada ao Supabase. Ela só atenderá geração após aplicar a migração de cotas e definir GEMINI_API_KEY e GEMINI_ENABLED=true no Supabase."
